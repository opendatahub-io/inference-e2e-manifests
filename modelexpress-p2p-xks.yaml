apiVersion: modelexpress.opendatahub.io/v1alpha1
kind: ModelExpressServer
metadata:
  name: modelexpress
spec:
  imagePullSecrets:
  - name: rhai-pull-secret
  metadataBackend:
    kubernetes: {}
  security:
    mode: enforce
    tokenAudiences:
    - modelexpress
    tenantIsolation: enforce
    allowedServiceAccounts:
    - namespace: llm-conformance-test
      serviceAccount: modelexpress-p2p-xks-kserve
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: modelexpress-p2p-xks
  annotations:
    serving.kserve.io/exp-modelexpress-mode: native
    serving.kserve.io/exp-modelexpress-address: http://modelexpress.llm-conformance-test.svc.cluster.local:8001
    serving.kserve.io/exp-modelexpress-token-audience: modelexpress
spec:
  model:
    uri: hf://Qwen/Qwen3-0.6B
    name: Qwen/Qwen3-0.6B
  replicas: 1
  router:
    scheduler:
      template:
        imagePullSecrets:
        - name: rhai-pull-secret
        containers:
        - name: main
    route: {}
    gateway: {}
  template:
    imagePullSecrets:
    - name: rhai-pull-secret
    containers:
      - name: main
        env:
          - name: UCX_TLS
            value: tcp,cuda_copy
          - name: UCX_PROTO_INFO
            value: "y"
        resources:
          limits:
            cpu: '4'
            memory: 16Gi
            nvidia.com/gpu: "1"
          requests:
            cpu: '2'
            memory: 8Gi
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
