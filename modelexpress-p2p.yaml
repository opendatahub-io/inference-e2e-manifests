apiVersion: modelexpress.opendatahub.io/v1alpha1
kind: ModelExpressServer
metadata:
  name: modelexpress
spec:
  metadataBackend:
    kubernetes: {}
  tls:
    secretName: modelexpress-tls
  serviceMetadata:
    annotations:
      service.beta.openshift.io/serving-cert-secret-name: modelexpress-tls
  security:
    mode: enforce
    tokenAudiences:
    - modelexpress
    tenantIsolation: enforce
    allowedServiceAccounts:
    - namespace: llm-conformance-test
      serviceAccount: modelexpress-p2p-kserve
  networkPolicy:
    allowFrom:
    - podSelector: {}
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: modelexpress-p2p
  annotations:
    serving.kserve.io/exp-modelexpress-mode: native
    serving.kserve.io/exp-modelexpress-address: https://modelexpress.llm-conformance-test.svc.cluster.local:8001
    serving.kserve.io/exp-modelexpress-token-audience: modelexpress
    serving.kserve.io/exp-modelexpress-ca-bundle-configmap: openshift-service-ca.crt
    serving.kserve.io/exp-modelexpress-ca-bundle-key: service-ca.crt
spec:
  model:
    uri: hf://Qwen/Qwen3-0.6B
    name: Qwen/Qwen3-0.6B
  replicas: 1
  router:
    scheduler:
      template:
        imagePullSecrets:
        - name: rhai-pull-secret
        containers:
        - name: main
    route: {}
    gateway: {}
  template:
    imagePullSecrets:
    - name: rhai-pull-secret
    - name: aipcc-pull-secret
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: feature.node.kubernetes.io/network-sriov.configured
              operator: NotIn
              values: ["true"]
    containers:
      - name: main
        image: quay.io/aipcc/rhaiis/cuda-ubi9:3.6.0-1793259641
        securityContext:
          capabilities:
            add: ["IPC_LOCK"]
        env:
          - name: MX_RDMA_NIC_PIN
            value: auto
          - name: UCX_RNDV_SCHEME
            value: get_zcopy
          - name: UCX_RNDV_THRESH
            value: "0"
        resources:
          limits:
            cpu: '4'
            memory: 16Gi
            nvidia.com/gpu: "1"
            rdma/rdma_shared_device_ib: "1"
          requests:
            cpu: '2'
            memory: 8Gi
            nvidia.com/gpu: "1"
            rdma/rdma_shared_device_ib: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTPS
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
